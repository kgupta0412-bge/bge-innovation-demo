    <style>
        /* Base Reset */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f7fb; 
        }

        /* Use the screenshot as the site background */
        body {
            background-image: url('BGE.png');
            background-size: 100% auto; 
            background-position: top center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* AI Search Bar Overlay Container */
        .ai-search-container {
            position: absolute;
            top: 150px; 
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1110px; 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* AI Search Bar Styling */
        .ai-search-bar {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 50px;
            padding: 8px 24px;
            width: 100%;
            box-shadow: 0 12px 32px rgba(0, 20, 50, 0.15);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .ai-search-bar:focus-within {
            border-color: #005eb8;
            box-shadow: 0 12px 36px rgba(0, 94, 184, 0.3);
        }

        /* AI Icon (Sparkles) */
        .ai-icon {
            font-size: 1.4rem;
            margin-right: 12px;
            background: linear-gradient(45deg, #005eb8, #00a0d2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }

        /* Input Field */
        .ai-search-bar input {
            border: none;
            outline: none;
            font-size: 1.1rem;
            flex-grow: 1;
            color: #001432;
            background: transparent;
            padding: 10px 0;
        }

        .ai-search-bar input::placeholder {
            color: #6b7280;
            font-style: italic;
        }

        /* Search Button */
        .search-btn {
            background-color: #001432;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-left: 10px;
        }

        .search-btn:hover {
            background-color: #005eb8;
        }
    </style>
</head>
