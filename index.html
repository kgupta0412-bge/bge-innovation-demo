<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bord Gáis Energy - Innovation Day Demo</title>
    <style>
        /* Base Reset */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f7fb; 
        }

        /* Use the screenshot as the site background */
        body {
            background-image: url('BGE.png');
            background-size: cover; 
            background-position: top center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* AI Search Bar Overlay Container */
        .ai-search-container {
            position: absolute;
            top: 150px; 
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1120px; 
            z-index: 10;
        }

        /* The Unified Wrapper for Input + Dropdown */
        .ai-search-wrapper {
            background: white;
            border-radius: 40px;
            box-shadow: 0 12px 32px rgba(0, 20, 50, 0.15);
            border: 2px solid transparent;
            transition: all 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Active State (When user clicks the search bar) */
        .ai-search-wrapper.active {
            border-color: #4a44d1; 
            border-radius: 16px; 
            box-shadow: 0 12px 36px rgba(74, 68, 209, 0.2);
        }

        /* Top Bar (Input Area) */
        .ai-search-bar {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            width: 100%;
            box-sizing: border-box;
        }

        /* AI Icon (Sparkles) */
        .ai-icon {
            font-size: 1.4rem;
            margin-right: 12px;
            background: linear-gradient(45deg, #4a44d1, #00a0d2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }

        /* Input Field */
        .ai-search-bar input {
            border: none;
            outline: none;
            font-size: 1.1rem;
            flex-grow: 1;
            color: #001432;
            background: transparent;
            padding: 10px 0;
        }

        .ai-search-bar input::placeholder {
            color: #6b7280;
        }

        /* Search Button */
        .search-btn {
            background-color: #001432;
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-left: 10px;
            padding: 0;
        }

        .search-btn:hover {
            background-color: #005eb8;
        }

        .search-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.2s ease;
        }

        .search-btn:hover svg {
            transform: translateY(-2px);
        }

        /* Dropdown Area */
        .ai-dropdown {
            display: none; 
            flex-direction: column;
            width: 100%;
            border-top: 1px solid #eaeaea;
            padding: 10px 0 16px 0;
            background-color: white;
        }

        /* Show dropdown when wrapper is active */
        .ai-search-wrapper.active .ai-dropdown {
            display: flex;
        }

        /* Individual Suggestion Items */
        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 12px 30px;
            cursor: pointer;
            color: #4a4a4a;
            font-size: 1.05rem;
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background-color: #f3f7fb;
            color: #001432;
        }

        /* Sparkle icon for dropdown items */
        .suggestion-item .sparkle {
            font-size: 1.1rem;
            margin-right: 15px;
            background: linear-gradient(45deg, #4a44d1, #00a0d2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Unified Search Component -->
    <div class="ai-search-container">
        <div class="ai-search-wrapper" id="search-wrapper">
            
            <!-- Input Area -->
            <div class="ai-search-bar">
                <div class="ai-icon">✨</div>
                <input type="text" id="ai-query-input" placeholder="Ask me anything..." autocomplete="off">
                <button class="search-btn" id="ai-trigger-btn" aria-label="Submit search">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Expandable Suggestions Dropdown -->
            <div class="ai-dropdown" id="ai-dropdown">
                <div class="suggestion-item" data-query="find a plan">
                    <span class="sparkle">✨</span> find a plan
                </div>
                <div class="suggestion-item" data-query="check for renewal options">
                    <span class="sparkle">✨</span> why is my bill so high?
                </div>
                <div class="suggestion-item" data-query="submit my meter read">
                    <span class="sparkle">✨</span> am I out of contract?
                </div>
                <div class="suggestion-item" data-query="update my email">
                    <span class="sparkle">✨</span> update my email
                </div>
				<div class="suggestion-item" data-query="i want to close my account">
                    <span class="sparkle">✨</span> i want to close my account
                </div>
            </div>

        </div>
    </div>

<script type='text/javascript' src='https://bordgaisenergyeandu--afdev2.sandbox.my.site.com/ESWBGEGithubDep1791797820412/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>

    <!-- Custom Bridging Logic & UI Behavior -->
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', (event) => {
            
            const wrapper = document.getElementById('search-wrapper');
            const queryInputBox = document.getElementById('ai-query-input');
            const triggerBtn = document.getElementById('ai-trigger-btn');
            const suggestionItems = document.querySelectorAll('.suggestion-item');

            // Launch Function (API Trigger)
            function launchAgentforce(textValue) {
                let queryText = textValue || queryInputBox.value;
                
                if (queryText && queryText.trim() !== '') {
                    if (typeof embeddedservice_bootstrap !== 'undefined') {
                        try {
                            // 1. Pass the exact search text to your custom parameter
                            embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
                                "Initial_Search_Query": queryText
                            });
                            
                            // 2. Launch the chat window
                            embeddedservice_bootstrap.utilAPI.launchChat();
                        } catch(err) {
                            console.error("Chat API error: " + err);
                        }
                    }
                } else {
                    // Launch normally if the search box is empty
                    if (typeof embeddedservice_bootstrap !== 'undefined') {
                        embeddedservice_bootstrap.utilAPI.launchChat();
                    }
                }
                
                // Close dropdown after launch
                wrapper.classList.remove('active');
            }

            // --- UI BEHAVIOR LISTENERS ---

            // Open dropdown when user clicks inside the input box
            if (queryInputBox) {
                queryInputBox.addEventListener('focus', () => {
                    wrapper.classList.add('active');
                });

                // Launch on Enter Key
                queryInputBox.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        launchAgentforce();
                    }
                });
            }

            // Close dropdown when user clicks anywhere outside the search container
            document.addEventListener('click', (e) => {
                if (!wrapper.contains(e.target)) {
                    wrapper.classList.remove('active');
                }
            });

            // Handle Clicks on Individual Suggestions
            suggestionItems.forEach(item => {
                item.addEventListener('click', function() {
                    const selectedText = this.getAttribute('data-query');
                    if (queryInputBox) {
                        queryInputBox.value = selectedText; 
                    }
                    launchAgentforce(selectedText); 
                });
            });

            // Handle Manual Button Click
            if (triggerBtn) {
                triggerBtn.addEventListener('click', () => {
                    launchAgentforce();
                });
            }
        });
    </script>

</body>
</html>
